<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Download</title>
</head>
<body>
<script>
    window.onload = () => {
        const tab = window.open("download.html", "_blank");

        if (!tab) {
            document.body.innerText =
                "Разрешите всплывающие окна для скачивания.";
        }
    };
</script>
</body>
</html>
